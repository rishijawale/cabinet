# Reference production setup for Cabinet: nginx serving the built frontend and
# reverse-proxying the API and media to uvicorn.
#
#   1. Build the frontend:      cd frontend && npm run build
#   2. Point this file's root at frontend/dist, adjust server_name, then reload.
#   3. Run the API behind it (see README "Production deployment"):
#      uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 \
#        --proxy-headers --forwarded-allow-ips="127.0.0.1"
#
# The `--proxy-headers` flags matter: rate limits and CORS see the real client
# IP from X-Forwarded-For instead of the proxy address.
#
# Terminate TLS in front of this server block (certbot --nginx, or a load
# balancer) and redirect :80 to :443.

server {
    listen 80;
    server_name cabinet.example;  # replace with your origin

    # The archive API accepts small payloads; 2m is generous.
    client_max_body_size 2m;

    # ------------------------------------------------------------------
    # Frontend (SPA) — built output in frontend/dist
    # ------------------------------------------------------------------
    root /opt/cabinet/frontend/dist;
    index index.html;

    # Vite emits content-hashed filenames under /assets/: cache them for as
    # long as possible. ^~ skips regex location checks below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # API and media — headers, compression and cache policy come from the API
    # (regex locations are evaluated top-down, so this must precede the
    # generic extension match that serves frontend files)
    # ------------------------------------------------------------------
    location ~ ^/(api/|media/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Fonts, favicons, sitemap and robots live in the frontend build output
    # and change only with deploys; a week is plenty.
    location ~* \.(?:woff2?|png|webp|ico|xml|txt)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # The entry document must always revalidate so deploys are picked up at
    # once; it references the hashed asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the client router's own 404 page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
