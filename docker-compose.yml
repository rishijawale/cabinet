services:
  db:
    image: postgres:16-alpine
    container_name: cabinet-db
    environment:
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: cabinet
      POSTGRES_DB: cabinet
    ports:
      - "5432:5432"
    volumes:
      - cabinet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cabinet-db:
